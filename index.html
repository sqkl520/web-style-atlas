<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>网站设计风格图集 · 30 个方案</title>
<meta name="description" content="30 个互不相同的网站设计风格方案，每个都配一个可运行的原型，全部收在一张可筛选的选型台上。">
<!-- 这个文件只做一件事：把站点根目录导向选型台。
     静态托管（GitHub Pages / Cloudflare Pages / Netlify / Nginx）拿它当入口，
     所以部署时不需要做任何路由配置。 -->
<meta http-equiv="refresh" content="0; url=./prototypes/_selection/">
<link rel="canonical" href="./prototypes/_selection/">
<style>
  html { background: #e7e7e2; color: #1c1b18; }
  body {
    margin: 0; min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    font-family: "Noto Sans SC", "Archivo", system-ui, sans-serif;
    font-size: 16px; line-height: 1.7;
  }
  main { padding: 32px; max-width: 46ch; }
  h1 { font-size: 24px; margin: 0 0 12px; }
  p { margin: 0 0 10px; }
  a { color: #1f3c60; text-decoration-thickness: 1px; text-underline-offset: 2px; }
  code { font-family: ui-monospace, "IBM Plex Mono", monospace; font-size: 0.94em; }
</style>
</head>
<body>
<main>
  <h1>正在前往选型台…</h1>
  <p>如果浏览器没有自动跳转，请手动打开 <a href="./prototypes/_selection/">prototypes/_selection/</a>。</p>
  <p>要单独看某一个原型：<code>prototypes/&lt;方案目录&gt;/</code>。</p>
</main>
</body>
</html>
